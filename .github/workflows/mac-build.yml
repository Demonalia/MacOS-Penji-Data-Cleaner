name: Build Mac App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyInstaller and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If your script requires other libraries (like flask, pywebview, requests), 
        # delete the '#' from the line below and type them here:
        # pip install flask

    - name: Build Mac App with PyInstaller
      run: |
        pyinstaller --onefile --windowed --add-data "assets:assets" desktop_app.py

    - name: Upload Finished Mac App
      uses: actions/upload-artifact@v4
      with:
        name: macos-app
        path: dist/
